# Redis cache for server-side code (Edge Functions or your own service).
# Supabase itself is managed by the Supabase CLI: `npx supabase start`.
services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
