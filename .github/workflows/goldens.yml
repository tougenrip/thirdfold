name: Goldens

# The renderer's golden images (src/lib/tabletop/golden.svelte.spec.ts), the slim set, only on
# pull requests that touch rendering: never on pushes, and never with the rest of the tests
# (ci.yml). The full set runs by hand before a rendering PR is opened (`npm run test:golden:full`).
on:
  pull_request:
    paths:
      - 'src/lib/tabletop/**'
      - 'src/lib/assets/**'
      - 'assets/**'
      - 'server/assets/**'
      - 'static/assets/**'
      - 'server/fixtures/**'
      - 'tests/fixtures/**'
      - 'tests/visual/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/goldens.yml'

concurrency:
  group: goldens-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:golden
      # Reference, actual and diff of each failing image.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs
          path: .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14
