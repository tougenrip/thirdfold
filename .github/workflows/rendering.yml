name: Rendering

# The renderer's pixel tests and golden images, only on pull requests that touch rendering: never
# on pushes, and never in ci.yml's verify job, which stays within minutes. Each group is its own
# job, side by side, within about 5 minutes. The full golden set runs by hand before a rendering
# PR is opened (`npm run test:golden:full`).
on:
  pull_request:
    paths:
      - 'src/lib/tabletop/**'
      - 'src/lib/assets/**'
      - 'assets/**'
      - 'server/assets/**'
      - 'static/assets/**'
      - 'server/fixtures/**'
      - 'tests/fixtures/**'
      - 'tests/visual/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rendering.yml'

concurrency:
  group: rendering-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: goldens 1
            run: THIRDFOLD_SHARD=1/3 npm run test:golden
          - name: goldens 2
            run: THIRDFOLD_SHARD=2/3 npm run test:golden
          - name: goldens 3
            run: THIRDFOLD_SHARD=3/3 npm run test:golden
          - name: smoke
            run: npm run test:render -- src/lib/tabletop/renderer.svelte.spec.ts
          - name: scheduling 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/scheduling.svelte.spec.ts
          - name: scheduling 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/scheduling.svelte.spec.ts
          - name: stability 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: stability 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: stability 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: fixtures 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: post
            run: npm run test:render -- src/lib/tabletop/post.svelte.spec.ts src/lib/tabletop/recovery.svelte.spec.ts
          - name: effects
            run: npm run test:render -- src/lib/tabletop/effects.svelte.spec.ts
          - name: lens
            run: npm run test:render -- src/lib/tabletop/grade.svelte.spec.ts src/lib/tabletop/overlay.svelte.spec.ts src/lib/tabletop/focus.svelte.spec.ts
          - name: shot
            run: npm run test:render -- src/lib/tabletop/shot-focus.svelte.spec.ts
          - name: unexplored-black 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/unexplored-black.svelte.spec.ts
          - name: unexplored-black 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/unexplored-black.svelte.spec.ts
          - name: fog
            run: npm run test:render -- src/lib/tabletop/fog-soft.svelte.spec.ts src/lib/tabletop/cell-maps.svelte.spec.ts src/lib/tabletop/exposure.svelte.spec.ts
          - name: sky
            run: npm run test:render -- src/lib/tabletop/sky.svelte.spec.ts src/lib/tabletop/sky-light.svelte.spec.ts
          - name: atmosphere
            run: npm run test:render -- src/lib/tabletop/atmosphere.svelte.spec.ts
          - name: flash 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/flash.svelte.spec.ts
          - name: flash 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/flash.svelte.spec.ts
          - name: materials
            run: npm run test:render -- src/lib/tabletop/materials.svelte.spec.ts src/lib/tabletop/mapping.svelte.spec.ts src/lib/tabletop/kind-layers.svelte.spec.ts
          - name: programs 1
            run: THIRDFOLD_SHARD=1/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 2
            run: THIRDFOLD_SHARD=2/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 3
            run: THIRDFOLD_SHARD=3/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 4
            run: THIRDFOLD_SHARD=4/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 5
            run: THIRDFOLD_SHARD=5/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 6
            run: THIRDFOLD_SHARD=6/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 7
            run: THIRDFOLD_SHARD=7/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 8
            run: THIRDFOLD_SHARD=8/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 9
            run: THIRDFOLD_SHARD=9/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 10
            run: THIRDFOLD_SHARD=10/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 11
            run: THIRDFOLD_SHARD=11/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 12
            run: THIRDFOLD_SHARD=12/12 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: lobby
            run: npm run test:render -- src/lib/tabletop/lobby.svelte.spec.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: ${{ matrix.group.run }}
      # Reference, actual and diff of each failing image.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.group.name }}-diffs
          path: .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14
