name: Rendering

# The renderer's pixel tests and golden images, only on pull requests that touch rendering: never
# on pushes, and never in ci.yml's verify job, which stays within minutes. Each group is its own
# job, side by side, within about 5 minutes: a long spec is split with `THIRDFOLD_SHARD=k/n` (every
# nth test from the kth: `shardedIt` in testing.ts, or the spec's own cases), and long files get a
# job each (files side by side slow each other on the runner's software GPU). The full golden set runs
# by hand before a rendering PR is opened (`npm run test:golden:full`).
on:
  pull_request:
    paths:
      - 'src/lib/tabletop/**'
      - 'src/lib/assets/**'
      - 'assets/**'
      - 'server/assets/**'
      - 'static/assets/**'
      - 'server/fixtures/**'
      - 'tests/fixtures/**'
      - 'tests/visual/**'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rendering.yml'

concurrency:
  group: rendering-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: goldens 1
            run: THIRDFOLD_SHARD=1/8 npm run test:golden
          - name: goldens 2
            run: THIRDFOLD_SHARD=2/8 npm run test:golden
          - name: goldens 3
            run: THIRDFOLD_SHARD=3/8 npm run test:golden
          - name: goldens 4
            run: THIRDFOLD_SHARD=4/8 npm run test:golden
          - name: goldens 5
            run: THIRDFOLD_SHARD=5/8 npm run test:golden
          - name: goldens 6
            run: THIRDFOLD_SHARD=6/8 npm run test:golden
          - name: goldens 7
            run: THIRDFOLD_SHARD=7/8 npm run test:golden
          - name: goldens 8
            run: THIRDFOLD_SHARD=8/8 npm run test:golden
          - name: smoke 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/renderer.svelte.spec.ts
          - name: smoke 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/renderer.svelte.spec.ts
          - name: scheduling 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/scheduling.svelte.spec.ts
          - name: scheduling 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/scheduling.svelte.spec.ts
          - name: scheduling 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/scheduling.svelte.spec.ts
          - name: stability 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: stability 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: stability 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/stability.svelte.spec.ts
          - name: fixtures 1
            run: THIRDFOLD_SHARD=1/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 2
            run: THIRDFOLD_SHARD=2/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 3
            run: THIRDFOLD_SHARD=3/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 4
            run: THIRDFOLD_SHARD=4/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 5
            run: THIRDFOLD_SHARD=5/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 6
            run: THIRDFOLD_SHARD=6/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 7
            run: THIRDFOLD_SHARD=7/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: fixtures 8
            run: THIRDFOLD_SHARD=8/8 npm run test:render -- src/lib/tabletop/fixtures.svelte.spec.ts
          - name: post
            run: npm run test:render -- src/lib/tabletop/post.svelte.spec.ts
          - name: recovery
            run: npm run test:render -- src/lib/tabletop/recovery.svelte.spec.ts
          - name: effects and lens
            run: npm run test:render -- src/lib/tabletop/effects.svelte.spec.ts src/lib/tabletop/grade.svelte.spec.ts src/lib/tabletop/overlay.svelte.spec.ts src/lib/tabletop/focus.svelte.spec.ts
          - name: shot
            run: npm run test:render -- src/lib/tabletop/shot-focus.svelte.spec.ts
          - name: unexplored-black 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/unexplored-black.svelte.spec.ts
          - name: unexplored-black 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/unexplored-black.svelte.spec.ts
          - name: unexplored-black 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/unexplored-black.svelte.spec.ts
          - name: fog
            run: npm run test:render -- src/lib/tabletop/fog-soft.svelte.spec.ts src/lib/tabletop/cell-maps.svelte.spec.ts src/lib/tabletop/exposure.svelte.spec.ts
          - name: sky
            run: npm run test:render -- src/lib/tabletop/sky.svelte.spec.ts src/lib/tabletop/sky-light.svelte.spec.ts
          - name: atmosphere 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/atmosphere.svelte.spec.ts
          - name: atmosphere 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/atmosphere.svelte.spec.ts
          - name: flash 1
            run: THIRDFOLD_SHARD=1/3 npm run test:render -- src/lib/tabletop/flash.svelte.spec.ts
          - name: flash 2
            run: THIRDFOLD_SHARD=2/3 npm run test:render -- src/lib/tabletop/flash.svelte.spec.ts
          - name: flash 3
            run: THIRDFOLD_SHARD=3/3 npm run test:render -- src/lib/tabletop/flash.svelte.spec.ts
          - name: materials
            run: npm run test:render -- src/lib/tabletop/materials.svelte.spec.ts src/lib/tabletop/mapping.svelte.spec.ts src/lib/tabletop/kind-layers.svelte.spec.ts
          - name: world
            run: npm run test:render -- src/lib/tabletop/world-layer.svelte.spec.ts
          - name: beyond
            run: npm run test:render -- src/lib/tabletop/beyond.svelte.spec.ts
          - name: floor splat
            run: npm run test:render -- src/lib/tabletop/floor-splat.svelte.spec.ts
          - name: grid
            run: npm run test:render -- src/lib/tabletop/grid-overlay.svelte.spec.ts
          - name: chasm
            run: npm run test:render -- src/lib/tabletop/chasm.svelte.spec.ts
          - name: drop-in
            run: npm run test:render -- src/lib/tabletop/drop-in.svelte.spec.ts
          - name: programs 1
            run: THIRDFOLD_SHARD=1/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 2
            run: THIRDFOLD_SHARD=2/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 3
            run: THIRDFOLD_SHARD=3/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 4
            run: THIRDFOLD_SHARD=4/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 5
            run: THIRDFOLD_SHARD=5/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 6
            run: THIRDFOLD_SHARD=6/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 7
            run: THIRDFOLD_SHARD=7/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 8
            run: THIRDFOLD_SHARD=8/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 9
            run: THIRDFOLD_SHARD=9/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 10
            run: THIRDFOLD_SHARD=10/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 11
            run: THIRDFOLD_SHARD=11/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 12
            run: THIRDFOLD_SHARD=12/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 13
            run: THIRDFOLD_SHARD=13/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 14
            run: THIRDFOLD_SHARD=14/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 15
            run: THIRDFOLD_SHARD=15/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 16
            run: THIRDFOLD_SHARD=16/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 17
            run: THIRDFOLD_SHARD=17/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: programs 18
            run: THIRDFOLD_SHARD=18/18 npm run test:render -- src/lib/tabletop/program-count.svelte.spec.ts
          - name: lights 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/grid-lights.svelte.spec.ts
          - name: lights 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/grid-lights.svelte.spec.ts
          - name: translucency
            run: npm run test:render -- src/lib/tabletop/translucency.svelte.spec.ts
          - name: hero shadows 1
            run: THIRDFOLD_SHARD=1/2 npm run test:render -- src/lib/tabletop/hero-shadows.svelte.spec.ts
          - name: hero shadows 2
            run: THIRDFOLD_SHARD=2/2 npm run test:render -- src/lib/tabletop/hero-shadows.svelte.spec.ts
          - name: lobby
            run: npm run test:render -- src/lib/tabletop/lobby.svelte.spec.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: ${{ matrix.group.run }}
      # Reference, actual and diff of each failing image.
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.group.name }}-diffs
          path: .vitest-attachments/
          if-no-files-found: ignore
          retention-days: 14
