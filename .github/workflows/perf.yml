name: Perf

# The renderer's perf gate (docs/PERFORMANCE.md): deterministic counters on the
# fixture tables, compared with docs/perf-baseline.json. Runs when rendering,
# assets, fixtures, the perf scripts or the baseline change.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/lib/tabletop/**'
      - 'server/assets/**'
      - 'assets/**'
      - 'scripts/perf-*.mjs'
      - 'scripts/check-bundle.mjs'
      - 'tests/fixtures/**'
      - 'docs/perf-baseline.json'
      - '.github/workflows/perf.yml'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Start the app and a game server
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          SCENES_DIR=$RUNNER_TEMP/scenes ROOMS_DIR=$RUNNER_TEMP/rooms LIBRARY_DIR=$RUNNER_TEMP/library \
            npm run server:start > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4173 > /dev/null && (echo > /dev/tcp/127.0.0.1/8787) 2> /dev/null; then exit 0; fi
            sleep 1
          done
          echo "The app or the game server did not start"; cat preview.log server.log; exit 1

      - name: Perf gate
        run: node scripts/perf-client.mjs --json perf.json --baseline docs/perf-baseline.json http://localhost:4173 tests/fixtures/scenes

      - name: Upload perf report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: perf.json
          if-no-files-found: ignore
          retention-days: 14
