name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The client test project runs component tests in headless Chromium.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run check
      - run: npm run lint
      # Live Supabase tests skip themselves without SUPABASE_* env.
      - run: npm test
      - run: npm run build
